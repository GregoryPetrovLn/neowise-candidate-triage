<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-2: #f7f8fb;
      --text: #15192b;
      --muted: #667085;
      --border: #e3e7ef;
      --accent: #4f46e5;
      --accent-strong: #4338ca;
      --accent-soft: #eef2ff;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --danger-border: #fda29b;
      --warn: #93370d;
      --warn-soft: #fffaeb;
      --warn-border: #fec84b;
      --ok: #027a48;
      --ok-soft: #ecfdf3;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 12px 32px -12px rgba(16, 24, 40, .18);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1017;
        --surface: #161a24;
        --surface-2: #1d2230;
        --text: #e7eaf2;
        --muted: #98a2b3;
        --border: #2a3040;
        --accent: #818cf8;
        --accent-strong: #a5b4fc;
        --accent-soft: #23264a;
        --danger: #fda29b;
        --danger-soft: #3a1a18;
        --danger-border: #7a2e28;
        --warn: #fec84b;
        --warn-soft: #3a2c10;
        --warn-border: #7a5a1a;
        --ok: #6ce9a6;
        --ok-soft: #10301f;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -12px rgba(0, 0, 0, .6);
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font: 1rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(60rem 30rem at 10% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
        radial-gradient(50rem 25rem at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }

    header { margin-bottom: 1.75rem; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: .45rem;
      font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      color: var(--accent);
    }
    .eyebrow::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    h1 { margin: .5rem 0 .35rem; font-size: clamp(1.7rem, 3.5vw, 2.25rem); line-height: 1.15; letter-spacing: -.02em; }
    .lead { margin: 0; color: var(--muted); max-width: 36rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    .card + .card { margin-top: 1rem; }

    label { display: block; font-weight: 600; margin-bottom: .5rem; }
    .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
    textarea {
      display: block; width: 100%; min-height: 8.5rem; resize: vertical;
      padding: .9rem 1rem; font: inherit; color: inherit;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    textarea[aria-invalid="true"] { border-color: var(--danger-border); box-shadow: 0 0 0 4px var(--danger-soft); }
    .error { color: var(--danger); font-size: .9rem; margin: .5rem 0 0; }

    .actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
    .counter { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .btn {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .7rem 1.25rem; font: inherit; font-weight: 600; color: #fff;
      background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
      transition: background .15s, transform .08s, opacity .15s;
    }
    .btn:hover { background: var(--accent-strong); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { cursor: progress; opacity: .7; }
    .btn-ghost {
      color: var(--accent); background: transparent; border: 1px solid var(--border);
      padding: .45rem .85rem; font-size: .9rem;
    }
    .btn-ghost:hover { background: var(--accent-soft); }
    .spinner {
      width: 1rem; height: 1rem; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .notice {
      display: grid; grid-template-columns: auto 1fr; gap: .9rem; align-items: start;
      padding: 1.1rem 1.25rem; border-radius: var(--radius); border: 1px solid;
      animation: rise .25s ease-out;
    }
    .notice-icon { width: 2.25rem; height: 2.25rem; border-radius: 10px; display: grid; place-items: center; font-size: 1.1rem; }
    .notice strong { display: block; margin-bottom: .15rem; }
    .notice p { margin: 0; color: var(--muted); font-size: .95rem; }
    .notice-manual { background: var(--warn-soft); border-color: var(--warn-border); }
    .notice-manual .notice-icon { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
    .notice-error { background: var(--danger-soft); border-color: var(--danger-border); }
    .notice-error .notice-icon { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }

    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .result-title { display: flex; align-items: center; gap: .75rem; }
    .status-dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
    .result-title h2 { margin: 0; font-size: 1.05rem; }
    .topic {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .25rem .7rem; border-radius: 999px; font-size: .85rem; font-weight: 600;
      background: var(--accent-soft); color: var(--accent);
    }
    .draft-label { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .5rem; }
    .draft-label span { font-size: .85rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    pre {
      margin: 0; padding: 1.1rem 1.25rem; white-space: pre-wrap; word-break: break-word;
      font: inherit; line-height: 1.6;
      background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 12px;
    }
    .fine { margin: .85rem 0 0; font-size: .85rem; color: var(--muted); }
    #draft-section { animation: rise .25s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .notice, #draft-section, .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">AI-помощник</span>
      <h1>Входящие заявки</h1>
      <p class="lead">Вставьте текст обращения клиента. Помощник определит тему и подготовит черновик ответа. Решение, что отправлять, остаётся за вами.</p>
    </header>

    <form class="card" novalidate>
      <label for="message">Текст заявки <span class="hint">· как написал клиент</span></label>
      <textarea id="message" required aria-describedby="input-error" placeholder="Например: «Добрый день, когда приедет доставка заказа №4821?»"></textarea>
      <p id="input-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <span class="counter" id="counter">0 символов</span>
        <button type="submit" id="submit" class="btn"><span id="submit-label">Разобрать заявку</span></button>
      </div>
    </form>

    <section id="status" aria-live="polite"></section>

    <section id="draft-section" class="card" hidden>
      <div class="result-head">
        <div class="result-title"><span class="status-dot" aria-hidden="true"></span><h2>Черновик готов</h2></div>
        <span class="topic" aria-label="Тема заявки">Тема: <span id="topic"></span></span>
      </div>
      <div class="draft-label">
        <span>Черновик ответа</span>
        <button type="button" id="copy" class="btn btn-ghost">Скопировать</button>
      </div>
      <pre id="draft"></pre>
      <p class="fine">Проверьте текст перед отправкой клиенту. Помощник может ошибаться.</p>
    </section>
  </main>

  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const inputError = document.querySelector("#input-error");
    const counter = document.querySelector("#counter");
    const submit = document.querySelector("#submit");
    const submitLabel = document.querySelector("#submit-label");
    const status = document.querySelector("#status");
    const draftSection = document.querySelector("#draft-section");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");
    const copyButton = document.querySelector("#copy");

    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    function plural(n) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return "символ";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "символа";
      return "символов";
    }
    function updateCounter() {
      const n = message.value.length;
      counter.textContent = `${n} ${plural(n)}`;
    }
    message.addEventListener("input", updateCounter);
    updateCounter();

    // Любой новый запрос начинает с чистого листа: старый черновик не должен
    // пережить сбой и попасть клиенту по ошибке.
    function clearResult() {
      status.replaceChildren();
      status.className = "";
      draftSection.hidden = true;
      topicEl.textContent = "";
      draftEl.textContent = "";
    }

    function showNotice(kind, icon, title, text) {
      status.className = `card notice notice-${kind}`;
      const iconEl = document.createElement("div");
      iconEl.className = "notice-icon";
      iconEl.setAttribute("aria-hidden", "true");
      iconEl.textContent = icon;
      const body = document.createElement("div");
      const strong = document.createElement("strong");
      strong.textContent = title;
      const p = document.createElement("p");
      p.textContent = text;
      body.append(strong, p);
      status.replaceChildren(iconEl, body);
    }

    function showInputError(text) {
      inputError.textContent = text;
      inputError.hidden = false;
      message.setAttribute("aria-invalid", "true");
      message.focus();
    }

    function clearInputError() {
      inputError.textContent = "";
      inputError.hidden = true;
      message.removeAttribute("aria-invalid");
    }

    function setBusy(busy) {
      submit.disabled = busy;
      submitLabel.textContent = busy ? "Разбираем…" : "Разобрать заявку";
      const spinner = submit.querySelector(".spinner");
      if (busy && !spinner) {
        const s = document.createElement("span");
        s.className = "spinner";
        s.setAttribute("aria-hidden", "true");
        submit.prepend(s);
      } else if (!busy && spinner) {
        spinner.remove();
      }
    }

    function render(payload) {
      if (payload.status === "ready") {
        topicEl.textContent = TOPIC_LABELS[payload.topic] ?? payload.topic;
        draftEl.textContent = payload.draft;
        draftSection.hidden = false;
        return;
      }
      if (payload.status === "manual_review") {
        showNotice(
          "manual", "✋",
          "Автоматический разбор недоступен",
          "Прочитайте заявку и ответьте клиенту вручную. Предыдущий черновик убран, чтобы не отправить его по ошибке.",
        );
        return;
      }
      if (payload.status === "invalid_input") {
        showInputError("Введите текст заявки.");
        return;
      }
      showNotice(
        "error", "!",
        "Сервис временно недоступен",
        "Попробуйте ещё раз через минуту или разберите заявку вручную.",
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearInputError();
      clearResult();

      const text = message.value;
      if (text.trim() === "") {
        showInputError("Введите текст заявки.");
        return;
      }

      setBusy(true);
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        render(await reply.json());
      } catch {
        render({ status: "network_error" });
      } finally {
        setBusy(false);
      }
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(draftEl.textContent);
        copyButton.textContent = "Скопировано";
      } catch {
        copyButton.textContent = "Не удалось";
      }
      setTimeout(() => { copyButton.textContent = "Скопировать"; }, 1500);
    });
  </script>
</body>
</html>
